[project]
name = "ai-queue-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "aio-pika>=9.4",
    "minio>=7.2",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "python-json-logger>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres,rabbitmq,minio]>=4.7",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "respx>=0.21",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["api", "workers", "shared"]
omit = ["tests/*", "*/__init__.py", "*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 0

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic", "migrations"]
