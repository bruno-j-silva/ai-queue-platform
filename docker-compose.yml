services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://enfila:enfila@postgres:5432/enfila
      RABBITMQ_URL: amqp://enfila:enfila@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      BACKEND_MODE: ${BACKEND_MODE:-ollama}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token}
      WEBHOOK_ALLOW_PRIVATE_URLS: ${WEBHOOK_ALLOW_PRIVATE_URLS:-false}
      WEBHOOK_RETRY_SCALE: ${WEBHOOK_RETRY_SCALE:-1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "workers.celery_app:app", "worker", "--loglevel=INFO"]
    environment: *app-environment
    ports:
      - "${WORKER_METRICS_PORT:-9100}:9100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  relay:
    build: .
    command: ["python", "-m", "workers.outbox_relay"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  webhook-retry-poller:
    build: .
    command: ["python", "-m", "workers.webhook_retry_poller"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enfila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enfila}
      POSTGRES_DB: ${POSTGRES_DB:-enfila}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enfila} -d ${POSTGRES_DB:-enfila}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-enfila}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-enfila}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.3.14
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 5
    profiles:
      - ollama

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  redis_data:
  ollama_data:

networks:
  default:
    name: enfila-net
